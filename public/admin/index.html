<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: app shell — slim brand bar, a tab rail (bottom bar on phones), one working column of panels */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F4; --line:#E2E2E8;
  --ink:#141416; --muted:#6B6B76; --accent:#141416; --on-accent:#FFFFFF; --accent-soft:#ECECF1; --iris:#7A78D8; --gold:#B08A2E;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23D9D8EE%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:invert(1) brightness(.18);
  --good:#1D7F49; --good-bg:#DFF2E6; --warn:#9A5A00; --warn-bg:#FBEBD2; --bad:#B8321F; --bad-bg:#FADFDA;
  --shadow:0 1px 2px rgba(18,23,41,.06),0 8px 24px rgba(18,23,41,.06);
  --f-display:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0E0E11; --surface-2:#18181D; --line:#26262E;
  --ink:#F5F5F7; --muted:#9D9DAA; --accent:#F5F5F7; --on-accent:#0A0A0C; --accent-soft:#1E1E27; --iris:#9C9AF0; --gold:#B08A2E;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%232A2944%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:none;
  --good:#5ACF8C; --good-bg:#11291D; --warn:#EDB050; --warn-bg:#2E2412; --bad:#FF8270; --bad-bg:#351915;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E11; --surface-2:#18181D; --line:#26262E;
  --ink:#F5F5F7; --muted:#9D9DAA; --accent:#F5F5F7; --on-accent:#0A0A0C; --accent-soft:#1E1E27; --iris:#9C9AF0; --gold:#B08A2E;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%232A2944%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:none;
  --good:#5ACF8C; --good-bg:#11291D; --warn:#EDB050; --warn-bg:#2E2412; --bad:#FF8270; --bad-bg:#351915;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg) var(--hex) right -20px top 40px/84px 146px repeat-y fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:grid;gap:5px;margin-right:auto;min-width:0}
.brand .logo{filter:var(--logo-filter);width:min(240px,52vw);height:auto;display:block}
.brand small{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--iris)}
.tab svg{width:18px;height:18px}
main{max-width:1180px;margin:0 auto;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,4vw,32px);letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:13px;margin:0 0 14px;letter-spacing:.2em;text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-num);font-size:22px;font-weight:600}
.kpi .note{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpi.hero .lab,.kpi.hero .note{color:var(--on-accent);opacity:.72}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.monthnav span{min-width:128px;text-align:center;font-weight:700}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.flow{display:grid;gap:8px}
.flow-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.flow-row .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.flow-row .bar i{display:block;height:100%;border-radius:4px}
.flow-row.total{border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.list{display:grid;gap:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.pcard{display:grid;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left}
.prod:hover{border-color:var(--iris)}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prod .name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.prod .cat{font-size:12.5px;color:var(--muted)}
.prod .price{font-family:var(--f-num);font-size:24px;font-weight:600}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.c-costo{background:var(--muted)} .c-com{background:var(--warn)} .c-pub{background:var(--gold)} .c-iva{background:var(--line)} .c-util{background:var(--good)} .c-loss{background:var(--bad)}
.prod .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.empty{text-align:center;padding:34px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;max-width:340px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,13,28,.48);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow);display:grid;margin:auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0}
.sheet-b{padding:18px;display:grid;gap:14px}
.sheet-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sheet-f .right{display:flex;gap:10px;margin-left:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.wide{grid-column:1/-1}
label.f input,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-weight:500;color:var(--ink);width:100%;min-width:0}
label.f .hint{font-weight:500;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.calc{background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:14px}
.calc .row{display:flex;justify-content:space-between;gap:10px}
.calc .row.big{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.calc .tip{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.setgrid{display:grid;gap:0}
.setrow{display:grid;grid-template-columns:1fr minmax(110px,160px);gap:6px 16px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.setrow:last-child{border-bottom:0}
.setrow .t{font-weight:600}
.setrow .m{color:var(--muted);font-size:13px;grid-column:1}
.setrow input,.setrow select{grid-row:1/span 2;grid-column:2;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;text-align:right;font-family:var(--f-num)}
.muted{color:var(--muted)}
.right{text-align:right}
@media (max-width:820px){
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;gap:0;z-index:25;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;min-width:0}
  .tab svg{width:21px;height:21px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>
</head>

const n=v=>{const x=parseFloat(String(v).replace(/[^\d.\-]/g,""));return isFinite(x)?x:0};
const crc=v=>(v<0?"−":"")+"₡"+Math.round(Math.abs(v)).toLocaleString("es-CR");
const pct=v=>(isFinite(v)?(v*100).toFixed(1):"0.0")+"%";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mkey=f=>String(f||"").slice(0,7);
const fmtDate=f=>{if(!f)return"";const[y,m,d]=f.split("-");return d+"/"+m+"/"+y.slice(2)};
const monthLabel=k=>{const[y,m]=k.split("-");return MESES[+m-1]+" "+y};
const shiftMonth=(k,d)=>{let[y,m]=k.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
function toast(msg){const r=$("#toast-root");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}

/* ---------- business math (same as the Excel) ---------- */
function calcProducto(p,cfg=S.cfg){
  const costo=n(p.costo), emp=p.empaque===""||p.empaque==null?cfg.empaque:n(p.empaque), env=p.envio===""||p.envio==null?cfg.envio:n(p.envio), otros=n(p.otros);
  const costoTotal=costo+emp+env+otros;
  const den=1-cfg.margen-cfg.publicidad-cfg.comision;
  const sugSinIva=den>0?costoTotal/den:0;
  const red=cfg.redondeo>0?cfg.redondeo:1;
  const sugerido=Math.ceil(sugSinIva*(cfg.iva?1+cfg.ivaTasa:1)/red)*red;
  const precio=n(p.precio)>0?n(p.precio):sugerido;
  const iva=cfg.iva?precio-precio/(1+cfg.ivaTasa):0;
  const neto=precio-iva, com=neto*cfg.comision, pub=neto*cfg.publicidad;
  const util=neto-com-pub-costoTotal, margen=neto?util/neto:0;
  const estado=margen>=cfg.margen-1e-4?"good":margen>=cfg.margenMin?"warn":"bad";
  return{costoTotal,sugerido,precio,iva,neto,com,pub,util,margen,markup:costoTotal?(neto-costoTotal)/costoTotal:0,estado,usaSugerido:!(n(p.precio)>0)};
}
const ESTADO={good:["Rentable","good"],warn:["Margen bajo","warn"],bad:["No rentable","bad"]};
function calcVenta(v,cfg=S.cfg){
  const total=n(v.cantidad)*n(v.precioUnit)-n(v.descuento);
  const iva=cfg.iva?total-total/(1+cfg.ivaTasa):0;
  const costo=n(v.cantidad)*n(v.costoUnit);
  const com=(v.pago==="Tarjeta"||v.pago==="Link de pago")?(total-iva)*cfg.comision:0;
  return{total,iva,costo,com,util:total-iva-costo-com};
}
function stockDe(p){const vend=S.ventas.filter(v=>v.productoId===p.id).reduce((a,v)=>a+n(v.cantidad),0);return{vend,actual:n(p.stockInicial)+n(p.entradas)-vend}}
function resumenMes(k){
  const vs=S.ventas.filter(v=>mkey(v.fecha)===k).map(v=>({v,c:calcVenta(v)}));
  const sum=f=>vs.reduce((a,x)=>a+x.c[f],0);
  const ventas=sum("total"),iva=sum("iva"),costo=sum("costo"),com=sum("com"),bruta=sum("util");
  const pub=S.campanas.filter(c=>mkey(c.inicio)===k).reduce((a,c)=>a+n(c.inversion),0);
  const gastos=S.gastos.filter(g=>mkey(g.fecha)===k).reduce((a,g)=>a+n(g.monto),0);
  const neta=bruta-pub-gastos;
  const canales={};vs.forEach(x=>{const c=x.v.canal||"Otro";canales[c]=canales[c]||{n:0,t:0,u:0};canales[c].n++;canales[c].t+=x.c.total;canales[c].u+=x.c.util});
  const unidades=vs.reduce((a,x)=>a+n(x.v.cantidad),0);
  return{pedidos:vs.length,unidades,ventas,iva,costo,com,bruta,pub,gastos,neta,margen:(ventas-iva)?neta/(ventas-iva):0,ticket:vs.length?ventas/vs.length:0,roas:pub?ventas/pub:0,canales};
}
function decisionCamp(c){const inv=n(c.inversion);if(!inv)return null;const r=n(c.ingresos)/inv;return r>=S.cfg.roas?["Escalar","good",r]:r>=1?["Optimizar","warn",r]:["Pausar","bad",r]}

/* ---------- data layer (servidor de pegasushyper.com) ---------- */
const COLS=["productos","ventas","campanas","gastos","pedidos"];
let pollTimer=null, knownOrders=null;
async function api(path,opt={}){
  const r=await fetch(path,{credentials:"same-origin",headers:{"content-type":"application/json"},...opt});
  if(r.status===401&&path!=="/api/login"){S.mode="login";render();throw {code:"auth"}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:"http",message:d.error||("Error "+r.status)};
  return d;
}
async function reload(quiet){
  try{
    const d=await api("/api/admin/all");
    S.cfg={...DEFAULT_CFG,...d.cfg};COLS.forEach(c=>S[c]=d[c]||[]);S.clientes=d.clientes||[];
    const web=S.pedidos.filter(p=>p.origen==="web").map(p=>p.id);
    if(knownOrders){const nuevos=S.pedidos.filter(p=>p.origen==="web"&&!knownOrders.has(p.id));if(nuevos.length){toast(nuevos.length===1?"Nuevo pedido de "+(nuevos[0].cliente||"un cliente")+" · "+crc(totalP(nuevos[0])):nuevos.length+" pedidos nuevos");document.title="("+nuevos.length+") Pegasus Hyper · Admin"}}
    knownOrders=new Set(web);
    S.mode="live";S.loaded=true;S.stale=false;
    if(!quiet||!document.querySelector("#sheet-root .scrim"))render();
  }catch(e){if(e&&e.code==="auth")return;S.stale=true;S.loaded=true;if(!quiet)render()}
}
async function saveDoc(col,id,data){
  try{
    const clean={...data};delete clean.id;delete clean._u;
    const r=await api("/api/admin/doc/"+col+(id?"/"+encodeURIComponent(id):""),{method:id?"PUT":"POST",body:JSON.stringify(clean)});
    const nid=id||r.id;const arr=S[col];const i=arr.findIndex(x=>x.id===nid);if(i>=0)arr[i]={id:nid,...clean};else arr.push({id:nid,...clean});
    render();return nid;
  }catch(e){if(e.code!=="auth")toast("No se pudo guardar. Revise su conexión e intente de nuevo.");return false}
}
async function delDoc(col,id){
  try{await api("/api/admin/doc/"+col+"/"+encodeURIComponent(id),{method:"DELETE"});S[col]=S[col].filter(x=>x.id!==id);render();return true}
  catch(e){if(e.code!=="auth")toast("No se pudo borrar. Intente de nuevo.");return false}
}
async function saveCfg(cfg){
  S.cfg=cfg;render();
  try{await api("/api/admin/config",{method:"PUT",body:JSON.stringify(cfg)})}catch(e){if(e.code!=="auth")toast("No se pudieron guardar los ajustes.")}
}
function vLogin(){
  return '<div class="panel" style="max-width:420px;margin:40px auto;display:grid;gap:14px"><h1 style="font-size:24px">Administración</h1><p class="sub" style="margin:0">Escriba su contraseña para entrar al panel de la tienda.</p>'+
   '<form id="loginf" style="display:grid;gap:12px"><label class="f" for="pw">Contraseña de administrador<input id="pw" type="password" autocomplete="current-password" required></label><div id="loginerr" class="muted" style="color:var(--bad);font-size:13px"></div><button class="btn primary" type="submit" id="loginb">Entrar</button></form>'+
   '<a href="/" class="muted" style="font-size:13px">← Volver al catálogo</a></div>';
}
function bindLogin(){
  const f=$("#loginf");if(!f)return;$("#pw").focus();
  f.addEventListener("submit",async e=>{e.preventDefault();const b=$("#loginb");b.disabled=true;b.textContent="Entrando…";$("#loginerr").textContent="";
    try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});S.mode="loading";render();await reload();startPoll()}
    catch(err){$("#loginerr").textContent=err.message||"No se pudo entrar.";b.disabled=false;b.textContent="Entrar"}});
}
function startPoll(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==="visible"&&S.mode==="live")reload(true)},20000)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){document.title="Pegasus Hyper · Admin";if(S.mode==="live")reload(true)}});
async function boot(){
  S.month=mkey(today());S.mode="loading";route();render();
  await reload();if(S.mode==="live")startPoll();
}

/* ---------- routing ---------- */
function route(){const h=(location.hash||"").slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:"inicio"}
window.addEventListener("hashchange",()=>{route();render();window.scrollTo(0,0)});

/* ---------- render ---------- */
function render(){
  
  $("#tabs").innerHTML=TABS.map(([k,l])=>'<a class="tab" href="#'+k+'" '+(S.view===k?'aria-current="page"':'')+'>'+ICONS[k]+'<span>'+l+'</span></a>').join("");
  document.querySelectorAll(".tab").forEach(a=>a.style.textDecoration="none");
  if(S.mode==="login"){$("#tabs").innerHTML="";$("#gear").hidden=true;$("#main").innerHTML=vLogin();bindLogin();return}
  $("#gear").hidden=false;
  let banner="";
  if(S.stale) banner='<div class="banner">No se pudo conectar con el servidor. Lo que ve puede estar desactualizado.</div>';
  const V={clientes:vClientes,pedidos:vPedidos,inicio:vInicio,productos:vProductos,ventas:vVentas,publicidad:vPublicidad,gastos:vGastos,ajustes:vAjustes}[S.view];
  $("#main").innerHTML=banner+(S.mode==="loading"?'<div class="panel empty"><b>Cargando su tienda…</b><span>Productos, ventas y números del mes aparecen aquí en un momento.</span></div>':V());
  bindView();
}
function header(t,sub,action){return '<div class="head"><div><h1>'+t+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'+(action||'')+'</div>'}

function vInicio(){
  const first=!S.productos.length?'<div class="panel" style="display:grid;gap:10px;border-color:var(--iris)"><b>Cargue sus productos</b><span class="muted">Su tienda todavía no tiene productos. Si tiene el archivo de respaldo que le preparó Claude, impórtelo en Ajustes. También puede agregarlos uno por uno en Productos.</span><div class="toolbar"><button class="btn primary" data-act="goImport">Ir a importar respaldo</button><a class="btn" href="#productos">Agregar productos</a></div></div>':'';
  const k=S.month, r=resumenMes(k);
  const monthnav='<div class="monthnav"><button class="iconbtn" data-act="mprev" aria-label="Mes anterior">‹</button><span>'+monthLabel(k)+'</span><button class="iconbtn" data-act="mnext" aria-label="Mes siguiente">›</button></div>';
  const kpis='<div class="kpis">'+
    '<div class="kpi hero"><span class="lab">Utilidad neta</span><span class="val">'+crc(r.neta)+'</span><span class="note">Margen '+pct(r.margen)+' de lo vendido</span></div>'+
    '<div class="kpi"><span class="lab">Ventas</span><span class="val">'+crc(r.ventas)+'</span><span class="note">'+r.pedidos+' pedidos · '+r.unidades+' unidades</span></div>'+
    '<div class="kpi"><span class="lab">Ticket promedio</span><span class="val">'+crc(r.ticket)+'</span><span class="note">Lo que gasta cada cliente</span></div>'+
    '<div class="kpi"><span class="lab">Retorno de anuncios</span><span class="val">'+(r.pub?r.roas.toFixed(1)+"x":"—")+'</span><span class="note">'+(r.pub?"₡"+r.roas.toFixed(1)+" vendidos por cada ₡1":"Sin publicidad este mes")+'</span></div></div>';
  const base=Math.max(r.ventas,1);
  const rows=[["Ventas cobradas",r.ventas,"var(--iris)"],["IVA",-r.iva,"var(--line)"],["Costo de productos",-r.costo,"var(--muted)"],["Comisiones de pago",-r.com,"var(--warn)"],["Publicidad",-r.pub,"var(--gold)"],["Gastos del negocio",-r.gastos,"var(--bad)"]].filter((x,i)=>i===0||x[1]!==0);
  const flow='<div class="panel"><h2>¿A dónde se fue cada colón?</h2><div class="flow">'+rows.map(([l,v,c])=>'<div class="flow-row"><span>'+l+'</span><span class="num">'+crc(v)+'</span><div class="bar"><i style="width:'+Math.min(100,Math.abs(v)/base*100)+'%;background:'+c+'"></i></div></div>').join("")+
    '<div class="flow-row total"><span>Le queda limpio</span><span class="num" style="color:'+(r.neta<0?'var(--bad)':'var(--good)')+'">'+crc(r.neta)+'</span></div></div></div>';
  // chart 6 months
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(k,-i));
  const data=ms.map(m=>{const x=resumenMes(m);return{m,v:x.ventas,u:x.neta}});
  const mx=Math.max(1,...data.map(d=>d.v),...data.map(d=>d.u)), mn=Math.min(0,...data.map(d=>d.u));
  const W=560,H=220,pl=8,pr=8,pt=12,pb=28,ch=H-pt-pb,y=v=>pt+(mx-v)/(mx-mn)*ch, bw=(W-pl-pr)/6;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventas y utilidad neta, últimos seis meses">';
  [0.5,1].forEach(f=>{const yy=y(mx*f);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-dasharray="3 4"/>'});
  data.forEach((d,i)=>{const x0=pl+i*bw+bw*0.18,w=bw*0.3,z=y(0);
    svg+='<rect x="'+x0+'" y="'+Math.min(y(d.v),z)+'" width="'+w+'" height="'+Math.max(1,Math.abs(z-y(d.v)))+'" rx="3" fill="var(--accent-soft)" stroke="var(--iris)" stroke-width="1"/>';
    svg+='<rect x="'+(x0+w+3)+'" y="'+Math.min(y(d.u),z)+'" width="'+w+'" height="'+Math.max(1,Math.abs(z-y(d.u)))+'" rx="3" fill="'+(d.u<0?'var(--bad)':'var(--good)')+'"/>';
    svg+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" '+(d.m===k?'style="fill:var(--ink);font-weight:700"':'')+'>'+MESES[+d.m.split("-")[1]-1].slice(0,3)+'</text>'});
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)"/></svg>';
  const chart='<div class="panel chart"><h2>Últimos 6 meses</h2>'+svg+'<div class="legend" style="margin-top:8px"><span><b style="background:var(--accent-soft);outline:1px solid var(--iris)"></b>Ventas</span><span><b class="c-util"></b>Utilidad neta</span><span class="num">Máx. '+crc(mx)+'</span></div></div>';
  // alerts
  const al=[];
  const pn=S.pedidos.filter(p=>p.estado==="nuevo").length,pp=S.pedidos.filter(p=>p.estado==="pagado").length,plst=S.pedidos.filter(p=>p.estado==="listo").length;
  if(pn)al.push(["neutral",pn+" por cobrar","Pedidos nuevos esperando el pago"]);if(pp)al.push(["warn",pp+" por comprar","Pedidos pagados: revise la lista de compras"]);if(plst)al.push(["warn",plst+" por despachar","Pedidos listos para enviar"]);
  S.productos.forEach(p=>{const s=stockDe(p);if(s.actual<=0)al.push(["bad","Agotado",p.nombre]);else if(s.actual<=n(p.stockMin))al.push(["warn","Quedan "+s.actual,p.nombre+" — toca reabastecer"])});
  S.productos.forEach(p=>{const c=calcProducto(p);if(c.estado==="bad")al.push(["bad","Pierde margen",p.nombre+" deja "+pct(c.margen)])});
  S.campanas.filter(c=>mkey(c.inicio)===k).forEach(c=>{const d=decisionCamp(c);if(d&&d[1]==="bad")al.push(["bad","Pausar anuncio",c.nombre+" — retorno "+d[2].toFixed(1)+"x"]);if(d&&d[1]==="good")al.push(["good","Escalar anuncio",c.nombre+" — retorno "+d[2].toFixed(1)+"x"])});
  const alerts='<div class="panel"><h2>Atención</h2>'+(al.length?'<div class="list">'+al.map(a=>'<div class="item"><span class="t">'+esc(a[2])+'</span><span class="pill '+a[0]+'">'+a[1]+'</span></div>').join("")+'</div>':'<p class="muted" style="margin:0">Todo en orden: stock suficiente, productos rentables y sin anuncios por pausar.</p>')+'</div>';
  const cs=Object.entries(r.canales).sort((a,b)=>b[1].t-a[1].t);
  const canal='<div class="panel"><h2>Ventas por canal</h2>'+(cs.length?'<div class="flow">'+cs.map(([c,x])=>'<div class="flow-row"><span>'+esc(c)+' <span class="muted">· '+x.n+' pedidos</span></span><span class="num">'+crc(x.t)+'</span><div class="bar"><i style="width:'+(x.t/Math.max(r.ventas,1)*100)+'%;background:var(--iris)"></i></div></div>').join("")+'</div>':'<p class="muted" style="margin:0">Cuando registre ventas este mes, verá aquí cuál canal vende más.</p>')+'</div>';
  return first+header("Hola, "+esc(S.cfg.nombre),"Así va el negocio en "+monthLabel(k).toLowerCase(),monthnav+' <button class="btn primary" data-act="newVenta">+ Registrar venta</button>')+kpis+'<div class="grid2">'+flow+chart+'</div><div class="grid2">'+alerts+canal+'</div>';
}

function splitBar(c){
  const tot=Math.max(c.precio,1);
  const seg=[["c-costo",c.costoTotal],["c-com",c.com],["c-pub",c.pub],["c-iva",c.iva],[c.util<0?"c-loss":"c-util",Math.abs(c.util)]];
  const sum=seg.reduce((a,s)=>a+s[1],0)||1;
  return '<div class="split" aria-hidden="true">'+seg.map(s=>s[1]>0?'<i class="'+s[0]+'" style="width:'+(s[1]/sum*100)+'%"></i>':"").join("")+'</div>';
}
function vProductos(){
  const q=S.q.toLowerCase();
  const ps=S.productos.filter(p=>!q||(p.nombre+" "+(p.categoria||"")).toLowerCase().includes(q)).sort((a,b)=>String(a.nombre).localeCompare(b.nombre));

    return '<button class="prod" data-edit-prod="'+esc(p.id)+'"><div class="top">'+(fotoSrc(p)?'<img src="'+esc(fotoSrc(p))+'" alt="" width="52" height="52" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:#fff">':'')+'<div style="flex:1;min-width:0"><div class="name">'+esc(p.nombre)+'</div><div class="cat">'+esc(p.categoria||"Sin categoría")+(p.modelo?' · Modelo '+esc(p.modelo):'')+'</div></div><span class="pill '+e[1]+'">'+e[0]+'</span></div>'+(p.visible===false?'<span class="pill neutral" style="justify-self:start">Oculto en catálogo</span>':p.agotado?'<span class="pill bad" style="justify-self:start">Agotado en catálogo</span>':'')+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="price">'+crc(c.precio)+'</span><span class="num" style="color:'+(c.util<0?'var(--bad)':'var(--good)')+';font-weight:600">gana '+crc(c.util)+'</span></div>'+

  const empty='<div class="panel empty"><b>'+(S.productos.length?'Ningún producto coincide con la búsqueda':'Agregue su primer producto')+'</b><span>Ponga lo que le cobra el proveedor y la app le calcula el precio de venta y cuánto le queda limpio.</span>'+(S.productos.length?'':'<button class="btn primary" data-act="newProd">+ Nuevo producto</button>')+'</div>';
  return header("Productos y precios",S.productos.length+" productos · margen objetivo "+pct(S.cfg.margen),'<button class="btn primary" data-act="newProd">+ Nuevo producto</button>')+tb+(ps.length?legend+'<div class="pgrid">'+cards+'</div>':empty);

function vVentas(){
  const vs=[...S.ventas].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const k=mkey(today()), r=resumenMes(k);
  const kp='<div class="kpis"><div class="kpi"><span class="lab">Vendido este mes</span><span class="val">'+crc(r.ventas)+'</span></div><div class="kpi"><span class="lab">Ganancia bruta del mes</span><span class="val">'+crc(r.bruta)+'</span><span class="note">Antes de publicidad y gastos</span></div><div class="kpi"><span class="lab">Pedidos del mes</span><span class="val">'+r.pedidos+'</span></div></div>';

/* ---------- sheets (forms) ---------- */
function openSheet(title,body,foot,onMount){
  $("#sheet-root").innerHTML='<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-h"><h2>'+esc(title)+'</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div><div class="sheet-b">'+body+'</div><div class="sheet-f">'+foot+'</div></div></div>';
  $("#sheet-root .scrim").addEventListener("click",e=>{if(e.target.dataset.close)closeSheet()});
  $("#sheet-root .sheet-h .iconbtn").addEventListener("click",closeSheet);
  const first=$("#sheet-root input,#sheet-root select");if(first)first.focus();
  if(onMount)onMount();
}
function closeSheet(){$("#sheet-root").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const fld=(id,label,val,opt={})=>'<label class="f'+(opt.wide?' wide':'')+'" for="'+id+'">'+label+(opt.hint?' <span class="hint">'+opt.hint+'</span>':'')+'<input id="'+id+'" '+(opt.type?'type="'+opt.type+'"':'')+' '+(opt.num?'inputmode="decimal"':'')+' value="'+esc(val==null?"":val)+'" '+(opt.ph?'placeholder="'+esc(opt.ph)+'"':'')+'></label>';
const sel=(id,label,opts,val,opt={})=>'<label class="f'+(opt.wide?' wide':'')+'" for="'+id+'">'+label+'<select id="'+id+'">'+opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return'<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>'}).join("")+'</select></label>';
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
function delButton(){return '<button class="btn danger" data-del="1">Borrar</button>'}
function armDelete(fn){const b=$("#sheet-root [data-del]");if(!b)return;b.addEventListener("click",async()=>{if(b.dataset.armed){b.disabled=true;if(await fn()){closeSheet();toast("Borrado")}}else{b.dataset.armed="1";b.textContent="Toque otra vez para borrar"}})}

function fotoSrc(p){return p.fotoSubida?"/api/foto/"+encodeURIComponent(p.id)+"?v="+(p.fotoV||1):(p.foto?"/"+String(p.foto).replace(/^\//,""):"")}
function resizeImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.85))};im.src=r.result};r.readAsDataURL(file)})}

    const upd=()=>{const d=read(),c=calcProducto(d),e=ESTADO[c.estado];

const EST={nuevo:["Nuevo","neutral"],pagado:["Pagado","warn"],listo:["Listo para enviar","warn"],enviado:["Enviado","good"],entregado:["Entregado","good"],cancelado:["Cancelado","bad"]};
const ACTIVOS=["nuevo","pagado","listo","enviado"];
const parseCRC=s=>+(String(s).replace(/[^\d]/g,""))||0;
const nuevoCodigo=()=>{const d=new Date();return (S.cfg.prefijo||"PH")+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(Math.floor(100+Math.random()*900))};
const subtotalP=p=>(p.items||[]).reduce((a,i)=>a+n(i.cantidad)*n(i.precio),0);
const totalP=p=>subtotalP(p)+n(p.envioCosto);
const itemsTxt=p=>(p.items||[]).map(i=>"• "+n(i.cantidad)+" x "+i.nombre).join("\n");
async function copyText(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok||"Copiado")}catch(e){toast("No se pudo copiar en este dispositivo")}}
function envios(){return Array.isArray(S.cfg.envios)&&S.cfg.envios.length?S.cfg.envios:DEFAULT_CFG.envios}
function pagos(){return Array.isArray(S.cfg.pagos)&&S.cfg.pagos.length?S.cfg.pagos:DEFAULT_CFG.pagos}

/* units already promised to orders that are ready or on the way (not yet sales) */
function reservado(pid){return S.pedidos.filter(p=>p.estado==="listo"||p.estado==="enviado").reduce((a,p)=>a+(p.items||[]).filter(i=>i.productoId===pid).reduce((b,i)=>b+n(i.cantidad),0),0)}
function listaCompras(incluirNuevos){
  const est=incluirNuevos?["nuevo","pagado"]:["pagado"];
  const need={};
  S.pedidos.filter(p=>est.includes(p.estado)).forEach(p=>(p.items||[]).forEach(i=>{const k=i.productoId||("x:"+i.nombre);need[k]=need[k]||{pid:i.productoId,nombre:i.nombre,q:0};need[k].q+=n(i.cantidad)}));
  const out=[];
  Object.values(need).forEach(x=>{const p=S.productos.find(q=>q.id===x.pid);const disp=p?Math.max(0,stockDe(p).actual-reservado(p.id)):0;const comprar=Math.max(0,x.q-disp);
    out.push({...x,prod:p,disp,comprar,proveedor:p&&p.proveedor?p.proveedor:"Sin proveedor",costo:p?n(p.costo):0})});
  return out;
}

async function setEstado(p,est){
  if(p.estado===est)return true;
  const base={...p};delete base.id;
  if(est==="entregado"){
    for(const i of (p.items||[])){
      const pr=S.productos.find(q=>q.id===i.productoId);
      const ok=await saveDoc("ventas",null,{fecha:today(),productoId:i.productoId||"",nombre:i.nombre,cantidad:n(i.cantidad),precioUnit:n(i.precio),costoUnit:pr?calcProducto(pr).costoTotal:0,descuento:0,canal:p.canal||"Catálogo",pago:p.pago||"",cliente:p.cliente||"",pedidoId:p.id,pedido:p.codigo});
      if(!ok)return false;
    }
  }
  if(p.estado==="entregado"&&est!=="entregado"){
    for(const v of S.ventas.filter(v=>v.pedidoId===p.id)) await delDoc("ventas",v.id);
  }
  return saveDoc("pedidos",p.id,{...base,estado:est,["f_"+est]:today()});
}

function parsePedido(txt){
  const g=(re)=>{const m=txt.match(re);return m?m[1].trim():""};
  const items=[];
  txt.split(/\n/).forEach(l=>{const m=l.match(/^\s*[•\-*·]?\s*(\d+)\s*[x×]\s*(.+?)(?:\s*\[([\w\-.:]+)\])?\s*[—–-]\s*₡\s*([\d.,\s]+)\s*$/i);
    if(m){const q=+m[1],nm=m[2].trim(),id=m[3]||"",tot=parseCRC(m[4]);const pr=S.productos.find(x=>x.id===id)||S.productos.find(x=>String(x.nombre).toLowerCase()===nm.toLowerCase());items.push({productoId:pr?pr.id:"",nombre:pr?pr.nombre:nm,cantidad:q,precio:q?Math.round(tot/q):tot})}});
  const envM=txt.match(/^\s*Env[ií]o:\s*(.+?)\s*[—–-]\s*₡\s*([\d.,]+)/mi);
  return{codigo:g(/PEDIDO\s+([A-Z]{1,5}-[\d-]+)/i)||nuevoCodigo(),fecha:today(),estado:"nuevo",cliente:g(/^\s*Nombre:\s*(.+)$/mi),telefono:g(/^\s*Tel[eé]fono:\s*(.+)$/mi),direccion:g(/^\s*Direcci[oó]n:\s*(.+)$/mi),pago:g(/^\s*Pago:\s*(.+)$/mi)||pagos()[0],envio:envM?envM[1].trim():envios()[0].n,envioCosto:envM?parseCRC(envM[2]):envios()[0].c,notas:g(/^\s*Notas?:\s*(.+)$/mi),canal:"Catálogo",items};
}
function formPegar(){
  openSheet("Pegar pedido de WhatsApp",'<p class="muted" style="margin:0">Copie el mensaje que le mandó el cliente desde el catálogo y péguelo aquí. La app lee los productos, el envío y los datos del cliente.</p><label class="f" for="paste-t">Mensaje del pedido<textarea id="paste-t" rows="10" style="border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;font:inherit;color:var(--ink);width:100%;resize:vertical"></textarea></label><div class="calc" id="paste-r"><span class="tip">Todavía no ha pegado nada.</span></div>',
   '<div class="right"><button class="btn" data-close="1">Cancelar</button><button class="btn primary" id="paste-go" disabled>Revisar y guardar</button></div>',()=>{
    const t=$("#paste-t");let parsed=null;
    t.addEventListener("input",()=>{parsed=parsePedido(t.value);const ok=parsed.items.length>0;$("#paste-go").disabled=!ok;
      $("#paste-r").innerHTML=ok?'<div class="row"><span>Pedido</span><span class="num">'+esc(parsed.codigo)+'</span></div><div class="row"><span>Cliente</span><span>'+esc(parsed.cliente||"—")+'</span></div><div class="row"><span>Productos</span><span>'+parsed.items.length+(parsed.items.some(i=>!i.productoId)?' <span class="pill warn">'+parsed.items.filter(i=>!i.productoId).length+' sin reconocer</span>':'')+'</span></div><div class="row big"><span>Total</span><span class="num">'+crc(totalP(parsed))+'</span></div>':'<span class="tip" style="color:var(--bad)">No encontré productos en el texto. Revise que pegó el mensaje completo del catálogo.</span>'});
    $("#paste-go").addEventListener("click",()=>{if(!parsed)return;if(S.pedidos.some(p=>p.codigo===parsed.codigo)){toast("Ese pedido ya está registrado.");return}closeSheet();formPedido(null,parsed)});
  });
}

async function comprarTodo(){
  const buy=listaCompras(!!S.incNuevos).filter(x=>x.comprar>0&&x.prod);
  for(const x of buy){const d={...x.prod};delete d.id;d.entradas=n(d.entradas)+x.comprar;if(!await saveDoc("productos",x.prod.id,d))return}
  const est=S.incNuevos?["nuevo","pagado"]:["pagado"];
  for(const p of S.pedidos.filter(p=>est.includes(p.estado)))await setEstado(p,"listo");
  toast("Inventario actualizado. Los pedidos quedaron listos para enviar.");S.pv="enviar";render();
}

function bindPedidos(m){
  m.querySelectorAll("[data-pv]").forEach(b=>b.addEventListener("click",()=>{S.pv=b.dataset.pv;render()}));
  m.querySelectorAll("[data-pf]").forEach(b=>b.addEventListener("click",()=>{S.pf=b.dataset.pf;render()}));
  m.querySelectorAll("[data-open-ped]").forEach(b=>b.addEventListener("click",()=>formPedido(S.pedidos.find(p=>p.id===b.dataset.openPed))));
  m.querySelectorAll("[data-adv]").forEach(b=>b.addEventListener("click",async()=>{b.disabled=true;const p=S.pedidos.find(x=>x.id===b.dataset.adv);if(p&&await setEstado(p,b.dataset.to))toast("Pedido "+p.codigo+": "+EST[b.dataset.to][0].toLowerCase());else b.disabled=false}));
  m.querySelectorAll("[data-label]").forEach(b=>b.addEventListener("click",()=>{const p=S.pedidos.find(x=>x.id===b.dataset.label);copyText((S.cfg.nombre||"Pegasus Hyper").toUpperCase()+" — Pedido "+p.codigo+"\nPara: "+p.cliente+"\nTel: "+(p.telefono||"")+"\nDirección: "+(p.direccion||"")+"\nEnvío: "+(p.envio||"")+"\nContenido:\n"+itemsTxt(p)+(/contra entrega/i.test(p.pago||"")?"\nCOBRAR AL ENTREGAR: "+crc(totalP(p)):""),"Etiqueta copiada")}));
  m.querySelectorAll("[data-copyprov]").forEach(b=>b.addEventListener("click",()=>{const xs=listaCompras(!!S.incNuevos).filter(x=>x.comprar>0&&x.proveedor===b.dataset.copyprov);copyText("Hola, buenas. Quisiera hacer un pedido:\n"+xs.map(x=>"• "+x.comprar+" x "+x.nombre).join("\n")+"\n¿Me confirma disponibilidad y total? Gracias.\n— "+(S.cfg.nombre||"Pegasus Hyper"),"Lista copiada para el proveedor")}));
  const inc=$("#incN");if(inc)inc.addEventListener("change",()=>{S.incNuevos=inc.checked;render()});
  m.querySelectorAll("[data-act]").forEach(b=>{const a=b.dataset.act;if(a==="newPedido")b.addEventListener("click",()=>{if(!S.productos.length){toast("Primero agregue un producto.");return}formPedido()});if(a==="pasteP")b.addEventListener("click",formPegar);if(a==="buyAll")b.addEventListener("click",()=>{b.disabled=true;comprarTodo()})});
}

/* ---------- clientes ---------- */
function vClientes(){
  const q=(S.qc||"").toLowerCase();
  const stats=c=>{const ps=S.pedidos.filter(p=>p.clienteId===c.id&&p.estado!=="cancelado");return{n:ps.length,t:ps.reduce((a,p)=>a+totalP(p),0),u:ps.map(p=>p.fecha).sort().pop()||""}};
  const cs=S.clientes.map(c=>({...c,_s:stats(c)})).filter(c=>!q||(c.nombre+" "+c.usuario+" "+(c.telefono||"")).toLowerCase().includes(q)).sort((a,b)=>b._s.t-a._s.t||String(b.creado).localeCompare(String(a.creado)));
  const tot=S.clientes.length,comp=S.clientes.filter(c=>stats(c).n>0).length;
  const kp='<div class="kpis"><div class="kpi"><span class="lab">Clientes registrados</span><span class="val">'+tot+'</span></div><div class="kpi"><span class="lab">Ya compraron</span><span class="val">'+comp+'</span><span class="note">'+(tot?pct(comp/tot):"—")+' de los registrados</span></div><div class="kpi"><span class="lab">Pedidos con cuenta</span><span class="val">'+S.pedidos.filter(p=>p.clienteId).length+'</span></div></div>';
  const list=cs.length?'<div class="pgrid">'+cs.map(c=>'<div class="prod" style="cursor:default"><div class="top"><div style="min-width:0"><div class="name">'+esc(c.nombre||"Sin nombre")+'</div><div class="cat">'+esc(c.usuario)+'</div></div>'+(c._s.n?'<span class="pill good">'+c._s.n+' pedido'+(c._s.n>1?'s':'')+'</span>':'<span class="pill neutral">Sin compras</span>')+'</div>'+
    '<div class="m" style="font-size:13.5px">Tel: <span class="num">'+esc(c.telefono||"—")+'</span><br>'+esc(c.direccion||"Sin dirección")+'</div>'+
    '<div class="foot"><span>Registrado '+esc(fmtDate(c.creado))+(c._s.u?' · última compra '+esc(fmtDate(c._s.u)):'')+'</span><span class="num" style="color:var(--ink);font-weight:600">'+crc(c._s.t)+'</span></div>'+
    '<div class="toolbar"><button class="btn small" data-reset="'+esc(c.id)+'">Restablecer contraseña</button><button class="btn small danger" data-delc="'+esc(c.id)+'">Borrar</button></div></div>').join("")+'</div>'
    :'<div class="panel empty"><b>'+(tot?'Ningún cliente coincide':'Todavía no hay clientes registrados')+'</b><span>Cuando un cliente cree su cuenta en el catálogo, aparece aquí con sus datos, sus pedidos y cuánto ha comprado.</span></div>';
  return header("Clientes","Clientes que crearon su cuenta en pegasushyper.com")+kp+'<div class="toolbar"><input class="search" id="qc" type="search" placeholder="Buscar por nombre, correo o teléfono" value="'+esc(S.qc||"")+'" aria-label="Buscar cliente"></div>'+list;
}
function bindClientes(m){
  const q=$("#qc");if(q)q.addEventListener("input",()=>{S.qc=q.value;const pos=q.selectionStart;render();const nq=$("#qc");nq.focus();try{nq.setSelectionRange(pos,pos)}catch(e){}});
  m.querySelectorAll("[data-reset]").forEach(b=>b.addEventListener("click",async()=>{const c=S.clientes.find(x=>x.id===b.dataset.reset);
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Toque otra vez para confirmar";return}
    b.disabled=true;try{const r=await api("/api/admin/clientes/"+encodeURIComponent(c.id)+"/reset",{method:"POST"});
      openSheet("Contraseña temporal",'<p style="margin:0">La nueva contraseña de <b>'+esc(c.nombre)+'</b> es:</p><div class="calc" style="font-size:22px;text-align:center"><b class="num" style="user-select:all">'+esc(r.temporal)+'</b></div><p class="muted" style="margin:0">Mándesela por WhatsApp y dígale que la cambie en <b>Mi cuenta</b> después de entrar.</p>','<div class="right"><button class="btn" id="cp-t">Copiar mensaje</button><button class="btn primary" data-close="1">Listo</button></div>',()=>{
        $("#cp-t").addEventListener("click",()=>copyText("Hola "+(c.nombre||"").split(" ")[0]+", su contraseña temporal de "+(S.cfg.nombre||"Pegasus Hyper")+" es: "+r.temporal+"\nEntre en pegasushyper.com con su correo "+c.usuario+" y cámbiela en Mi cuenta.","Mensaje copiado"))});
    }catch(e){if(e.code!=="auth")toast("No se pudo restablecer. Intente de nuevo.")}b.disabled=false;b.textContent="Restablecer contraseña";delete b.dataset.armed}));
  m.querySelectorAll("[data-delc]").forEach(b=>b.addEventListener("click",async()=>{if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Toque otra vez para borrar";return}if(await delDoc("clientes",b.dataset.delc))toast("Cliente borrado")}));
}

/* ---------- bindings ---------- */
function bindView(){
  const m=$("#main");
  if(S.view==="pedidos"){bindPedidos(m);}
  if(S.view==="clientes"){bindClientes(m);}
  m.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.act;
    if(a==="mprev"){S.month=shiftMonth(S.month,-1);render()} else if(a==="mnext"){S.month=shiftMonth(S.month,1);render()}
    else if(a==="newVenta")formVenta(); else if(a==="logout"){fetch("/api/logout",{method:"POST"}).finally(()=>{location.href="/"})} else if(a==="exportar"){const data={cfg:S.cfg};COLS.forEach(c=>data[c]=S[c]);const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="pegasus-respaldo-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)} else if(a==="goImport"){location.hash="#ajustes"} else if(a==="goPedidos"){location.hash="#pedidos"} else if(a==="newProd")formProducto(); else if(a==="newCamp")formCamp(); else if(a==="newGasto")formGasto();
    else if(a==="saveCfg"){const pc=id=>n(val(id))/100;const c={nombre:val("s-nombre")||"Pegasus Hyper",iva:val("s-iva")==="si",ivaTasa:pc("s-ivaTasa"),margen:pc("s-margen"),margenMin:pc("s-margenMin"),publicidad:pc("s-publicidad"),comision:pc("s-comision"),empaque:n(val("s-empaque")),envio:n(val("s-envio")),redondeo:n(val("s-redondeo"))||1,roas:n(val("s-roas"))||1,whatsapp:val("s-wa").replace(/[^\d]/g,""),prefijo:(val("s-pref")||"PH").toUpperCase().replace(/[^A-Z]/g,"").slice(0,5)||"PH",
      envios:(document.getElementById("s-envios").value||"").split("\n").map(l=>{const [a,b]=l.split("=");return{n:(a||"").trim(),c:parseCRC(b||"0")}}).filter(e=>e.n),pagos:val("s-pagos").split(",").map(x=>x.trim()).filter(Boolean)};
      if(c.margen+c.publicidad+c.comision>=0.95){toast("Margen + publicidad + comisión suman demasiado. Bájele a alguno.");return}
      saveCfg(c);toast("Ajustes guardados")}}));
  m.querySelectorAll("[data-edit-prod]").forEach(b=>b.addEventListener("click",()=>formProducto(S.productos.find(p=>p.id===b.dataset.editProd))));
  m.querySelectorAll("[data-edit-venta]").forEach(b=>b.addEventListener("click",()=>formVenta(S.ventas.find(p=>p.id===b.dataset.editVenta))));
  m.querySelectorAll("[data-edit-camp]").forEach(b=>b.addEventListener("click",()=>formCamp(S.campanas.find(p=>p.id===b.dataset.editCamp))));
  m.querySelectorAll("[data-edit-gasto]").forEach(b=>b.addEventListener("click",()=>formGasto(S.gastos.find(p=>p.id===b.dataset.editGasto))));
  const imp=$("#imp");if(imp)imp.addEventListener("change",async()=>{const f=imp.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const r=await api("/api/admin/import",{method:"POST",body:JSON.stringify(data)});toast("Respaldo importado: "+r.importados+" registros");await reload()}catch(e){if(e.code!=="auth")toast("No se pudo importar. Revise que sea el archivo de respaldo correcto.")}imp.value=""});
  const q=$("#q");if(q)q.addEventListener("input",()=>{S.q=q.value;const pos=q.selectionStart;render();const nq=$("#q");nq.focus();try{nq.setSelectionRange(pos,pos)}catch(e){}});
}
document.addEventListener("click",e=>{const c=e.target.closest(".sheet-f [data-close]");if(c)closeSheet()});

boot();
})();
</script>
