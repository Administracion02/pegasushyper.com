<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pegasus Hyper: tecnología y accesorios con envío a todo Costa Rica. Haga su pedido por WhatsApp.">
<title>Catálogo Pegasus Hyper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: dark storefront — logo hero over hex lines, product grid, cart drawer with WhatsApp checkout */
:root{
  --bg:#000000; --surface:#0E0E11; --surface-2:#18181D; --line:#26262E;
  --ink:#F5F5F7; --muted:#9D9DAA; --cta:#F5F5F7; --on-cta:#0A0A0C; --iris:#9C9AF0; --wa:#25D366; --bad:#FF8270;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%2324233C%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:none;
  --f-display:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3F6; --line:#E3E3EA;
  --ink:#141416; --muted:#6B6B76; --cta:#141416; --on-cta:#FFFFFF; --iris:#6F6CD3; --wa:#1DA851; --bad:#B8321F;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23DCDBEF%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:invert(1) brightness(.18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3F6; --line:#E3E3EA;
  --ink:#141416; --muted:#6B6B76; --cta:#141416; --on-cta:#FFFFFF; --iris:#6F6CD3; --wa:#1DA851; --bad:#B8321F;
  --hex:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2784%27%20height%3D%27146%27%20viewBox%3D%270%200%2084%20146%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23DCDBEF%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M42%200v24L21%2036%200%2024M42%2024l21%2012%2021-12M21%2036v37M63%2036v37M0%2085l21-12%2021%2012%2021-12%2021%2012M42%2085v37L21%20134M42%20122l21%2012M21%20134v12M63%20134v12%27/%3E%3C/g%3E%3C/svg%3E"); --logo-filter:invert(1) brightness(.18); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before,.hero::after{content:"";position:absolute;width:360px;height:300px;background:var(--hex);background-size:84px 146px;opacity:.9;pointer-events:none}
.hero::before{left:-40px;top:-40px}
.hero::after{right:-40px;bottom:-60px}
.hero .wrap{position:relative;padding-block:56px 44px;display:grid;justify-items:center;gap:14px;text-align:center}
.hero img{width:min(460px,82vw);height:auto;filter:var(--logo-filter)}
.hero .since{font-family:var(--f-display);letter-spacing:.42em;font-size:13px;color:var(--muted);text-transform:uppercase;padding-left:.42em}
.hero p{margin:6px 0 0;color:var(--muted);max-width:44ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.cat{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
main.wrap{padding-block:24px 120px;display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--surface-2) var(--hex);background-size:42px 73px;display:grid;place-items:center;color:var(--muted);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph svg{width:30%;height:30%;opacity:.85}
.ph .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:999px;color:var(--muted)}
.info{padding:14px;display:grid;gap:8px;align-content:start}
.info .n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.info .d{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.price{font-family:var(--f-display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.add{border:0;background:var(--cta);color:var(--on-cta);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:34px;height:36px;cursor:pointer;font-size:18px}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px}
.cartbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;background:var(--cta);color:var(--on-cta);border-radius:999px;padding:13px 22px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;max-width:calc(100% - 32px)}
.cartbtn b{font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(460px,100%);height:100%;display:grid;grid-template-rows:auto 1fr auto;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px}
.x{border:0;background:none;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;color:var(--muted)}
.db{overflow-y:auto;padding:16px 18px;display:grid;gap:16px;align-content:start}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line .n{font-weight:600;overflow-wrap:anywhere}
.line .s{color:var(--muted);font-size:13px}
.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:500;color:var(--ink);width:100%}
.fields{display:grid;gap:12px}
.tot{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:14px}
.tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot .big{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px}
.df{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:8px}
.wa{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--wa);color:#04170B;text-decoration:none;font-weight:800;border-radius:12px;padding:14px;font-size:16px}
.wa[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
.err{color:var(--bad);font-size:13px;text-align:center}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot .wrap{padding-block:24px 110px;display:grid;gap:6px;justify-items:center;text-align:center}
.sel{user-select:all;font-weight:700;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.5}}}
</style>
</head>

<script>
(function(){
"use strict";
const STORE={"nombre": "Pegasus Hyper", "whatsapp": "50661611731", "prefijo": "PH", "envios": [{"n": "Correos de Costa Rica", "c": 2500}, {"n": "Mensajero (GAM)", "c": 2000}, {"n": "Retiro en persona", "c": 0}], "pagos": ["SINPE Móvil", "Transferencia", "Efectivo contra entrega"]};
const PRODUCTS=[{"id": "ej-p1", "nombre": "Audífonos Bluetooth TWS (ejemplo)", "categoria": "Audio", "precio": 12500, "descripcion": "", "foto": "", "agotado": false}, {"id": "ej-p2", "nombre": "Cargador rápido 20W USB-C (ejemplo)", "categoria": "Cargadores", "precio": 7500, "descripcion": "", "foto": "", "agotado": false}, {"id": "ej-p3", "nombre": "Reloj inteligente (ejemplo)", "categoria": "Wearables", "precio": 22000.0, "descripcion": "", "foto": "", "agotado": false}];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const crc=v=>"₡"+Math.round(v).toLocaleString("es-CR");
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><path d="M12 22V12M20.66 7L12 12 3.34 7"/></svg>';
let cart={}, cat="Todos", form={nombre:"",telefono:"",direccion:"",envio:STORE.envios[0]?STORE.envios[0].n:"",pago:STORE.pagos[0]||"",notas:""};
try{const c=JSON.parse(localStorage.getItem("ph-cart")||"{}");Object.keys(c).forEach(k=>{if(PRODUCTS.some(p=>p.id===k))cart[k]=c[k]});const f=JSON.parse(localStorage.getItem("ph-form")||"null");if(f)form={...form,...f}}catch(e){}
const persist=()=>{try{localStorage.setItem("ph-cart",JSON.stringify(cart));localStorage.setItem("ph-form",JSON.stringify(form))}catch(e){}};
const phonePretty=STORE.whatsapp.replace(/^506/,"").replace(/(\d{4})(\d{4})/,"$1-$2");
$("#phone").textContent=phonePretty;

function renderCats(){
  const cats=["Todos",...new Set(PRODUCTS.map(p=>p.categoria).filter(Boolean))];
  $("#cats").innerHTML=cats.length>2?cats.map(c=>'<button class="cat" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join(""):"";
  $("#cats").parentElement.hidden=cats.length<=2;
  document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.c;render()}));
}
function qtyCtl(id){return '<span class="qty"><button aria-label="Quitar uno" data-m="'+id+'">−</button><span>'+cart[id]+'</span><button aria-label="Agregar uno" data-p="'+id+'">+</button></span>'}
function render(){
  renderCats();
  const ps=PRODUCTS.filter(p=>cat==="Todos"||p.categoria===cat);
  $("#main").innerHTML='<h2>'+(cat==="Todos"?"Todos los productos":esc(cat))+' · '+ps.length+'</h2>'+(ps.length?'<div class="grid">'+ps.map(p=>
    '<article class="card"><div class="ph">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="'+esc(p.nombre)+'">':ICON)+(p.categoria?'<span class="tag">'+esc(p.categoria)+'</span>':'')+'</div>'+
    '<div class="info"><div class="n">'+esc(p.nombre)+'</div>'+(p.descripcion?'<div class="d">'+esc(p.descripcion)+'</div>':'')+
    '<div class="row"><span class="price">'+crc(p.precio)+'</span>'+(p.agotado?'<span class="d">Agotado</span>':cart[p.id]?qtyCtl(p.id):'<button class="add" data-p="'+esc(p.id)+'">Agregar</button>')+'</div></div></article>').join("")+'</div>':'<div class="empty">No hay productos en esta categoría.</div>');
  bindQty(document);
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  const cb=$("#cartbtn");cb.hidden=!n;cb.innerHTML='Ver pedido · '+n+' '+(n===1?'producto':'productos')+' <b>'+crc(subtotal())+'</b>';
}
function bindQty(root){
  root.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{cart[b.dataset.p]=(cart[b.dataset.p]||0)+1;persist();refresh()}));
  root.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.m;cart[k]=(cart[k]||0)-1;if(cart[k]<=0)delete cart[k];persist();refresh()}));
}
function refresh(){render();if($("#drawer-root").innerHTML)openCart()}
const subtotal=()=>Object.entries(cart).reduce((a,[id,q])=>{const p=PRODUCTS.find(x=>x.id===id);return a+(p?p.precio*q:0)},0);
const envioSel=()=>STORE.envios.find(e=>e.n===form.envio)||STORE.envios[0]||{n:"",c:0};
let code=null;
function orderCode(){if(!code){const d=new Date();code=STORE.prefijo+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(Math.floor(100+Math.random()*900))}return code}
function message(){
  const e=envioSel(),sub=subtotal();
  const lines=Object.entries(cart).map(([id,q])=>{const p=PRODUCTS.find(x=>x.id===id);return "• "+q+" x "+p.nombre+" ["+p.id+"] — "+crc(p.precio*q)});
  return "🛒 PEDIDO "+orderCode()+" — "+STORE.nombre+"\n"+lines.join("\n")+"\nSubtotal: "+crc(sub)+"\nEnvío: "+e.n+" — "+crc(e.c)+"\nTotal: "+crc(sub+e.c)+"\n\nNombre: "+form.nombre+"\nTeléfono: "+form.telefono+"\nDirección: "+(form.direccion||"—")+"\nPago: "+form.pago+(form.notas?"\nNotas: "+form.notas:"");
}
function missing(){const m=[];if(!form.nombre.trim())m.push("su nombre");if(!form.telefono.trim())m.push("su teléfono");if(envioSel().c>0&&!form.direccion.trim())m.push("la dirección de entrega");return m}
function openCart(){
  const ids=Object.keys(cart);
  const e=envioSel(),sub=subtotal();
  const body=ids.length?ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return '<div class="line"><span class="n">'+esc(p.nombre)+'</span><span>'+crc(p.precio*cart[id])+'</span><span class="s">'+crc(p.precio)+' c/u</span>'+qtyCtl(id)+'</div>'}).join("")+
    '<div class="fields">'+
    '<label class="f" for="c-nombre">Nombre completo<input id="c-nombre" autocomplete="name" value="'+esc(form.nombre)+'"></label>'+
    '<label class="f" for="c-tel">Teléfono<input id="c-tel" type="tel" autocomplete="tel" inputmode="tel" value="'+esc(form.telefono)+'"></label>'+
    '<label class="f" for="c-env">Entrega<select id="c-env">'+STORE.envios.map(x=>'<option value="'+esc(x.n)+'"'+(x.n===e.n?' selected':'')+'>'+esc(x.n)+' · '+(x.c?crc(x.c):"Gratis")+'</option>').join("")+'</select></label>'+
    '<label class="f" for="c-dir">Dirección de entrega<textarea id="c-dir" rows="2" autocomplete="street-address" placeholder="Provincia, cantón, distrito y señas">'+esc(form.direccion)+'</textarea></label>'+
    '<label class="f" for="c-pago">Forma de pago<select id="c-pago">'+STORE.pagos.map(x=>'<option'+(x===form.pago?' selected':'')+'>'+esc(x)+'</option>').join("")+'</select></label>'+
    '<label class="f" for="c-notas">Notas (opcional)<input id="c-notas" value="'+esc(form.notas)+'" placeholder="Color, horario de entrega…"></label></div>'+
    '<div class="tot"><div><span>Productos</span><span>'+crc(sub)+'</span></div><div><span>Envío</span><span>'+(e.c?crc(e.c):"Gratis")+'</span></div><div class="big"><span>Total</span><span>'+crc(sub+e.c)+'</span></div></div>'
    :'<div class="empty">Su pedido está vacío. Agregue productos del catálogo.</div>';
  const miss=missing();
  const href="https://wa.me/"+STORE.whatsapp+"?text="+encodeURIComponent(message());
  $("#drawer-root").innerHTML='<div class="scrim" id="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Su pedido"><div class="dh"><h3>Su pedido</h3><button class="x" id="close" aria-label="Cerrar">✕</button></div><div class="db">'+body+'</div>'+
    (ids.length?'<div class="df">'+(miss.length?'<div class="err" id="miss">Falta '+miss.join(", ")+'.</div>':'')+'<a class="wa" id="send" href="'+esc(href)+'" target="_blank" rel="noopener" aria-disabled="'+(miss.length>0)+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.6-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-2 .9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>Enviar pedido por WhatsApp</a>'+
    '<div class="hint">Se abre WhatsApp con su pedido listo. Solo toque enviar. Si no se abre, escríbanos al <span class="sel">'+phonePretty+'</span>.</div></div>':'')+'</aside></div>';
  $("#scrim").addEventListener("click",ev=>{if(ev.target.id==="scrim")closeCart()});
  $("#close").addEventListener("click",closeCart);
  bindQty($("#drawer-root"));
  const bindF=(id,key,re)=>{const el=document.getElementById(id);if(!el)return;el.addEventListener(re?"change":"input",()=>{form[key]=el.value;persist();if(re)openCart();else updSend()})};
  bindF("c-nombre","nombre");bindF("c-tel","telefono");bindF("c-dir","direccion");bindF("c-notas","notas");bindF("c-env","envio",1);bindF("c-pago","pago",1);
  const s=$("#send");if(s)s.addEventListener("click",()=>{setTimeout(()=>{code=null},800)});
}
function updSend(){
  const s=$("#send");if(!s)return;const miss=missing();
  s.href="https://wa.me/"+STORE.whatsapp+"?text="+encodeURIComponent(message());s.setAttribute("aria-disabled",miss.length>0);
  let m=$("#miss");if(miss.length){if(!m){m=document.createElement("div");m.className="err";m.id="miss";s.before(m)}m.textContent="Falta "+miss.join(", ")+"."}else if(m)m.remove();
}
function closeCart(){$("#drawer-root").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
$("#cartbtn").addEventListener("click",openCart);
render();
})();
</script>
</body>
</html>
